{% load hr_extras %}

<!-- Modal Detail Karyawan -->
<div id="employeeModal" class="fixed inset-0 z-[99999] hidden flex items-center justify-center p-4" style="background-color: rgba(0,0,0,0.5);">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
        
        <!-- Header -->
        <div class="px-6 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 flex justify-between items-center">
            <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                Detail Karyawan
            </h3>
            <button onclick="closeModal()" class="text-white/80 hover:text-white transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Body -->
        <div class="p-6 max-h-[calc(90vh-180px)] overflow-y-auto bg-white dark:bg-gray-800">
            <!-- Loading -->
            <div id="modalLoading" class="flex flex-col items-center justify-center py-12" style="display: flex;">
                <div class="animate-spin h-12 w-12 border-4 border-blue-600 border-t-transparent rounded-full mb-4"></div>
                <p class="text-gray-500 dark:text-gray-400">Memuat data...</p>
            </div>
            
            <!-- Content -->
            <div id="modalContent" style="display: none;"></div>
        </div>
    </div>
</div>

<script>
// ============================================
// MODAL KARYAWAN - FUNGSI LENGKAP
// ============================================

let currentEmployeeData = null;

// Tab templates
const tabTemplates = {
    personal: (data) => `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-4">
                <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                    <label class="text-xs text-gray-500 dark:text-gray-400 uppercase">NIK</label>
                    <p class="text-sm font-semibold text-gray-900 dark:text-white">${data.employee_id || '-'}</p>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                    <label class="text-xs text-gray-500 dark:text-gray-400 uppercase">Nama</label>
                    <p class="text-sm font-semibold text-gray-900 dark:text-white">${data.nama || '-'}</p>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                    <label class="text-xs text-gray-500 dark:text-gray-400 uppercase">Department</label>
                    <p class="text-sm text-gray-900 dark:text-white">${data.department || '-'}</p>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                    <label class="text-xs text-gray-500 dark:text-gray-400 uppercase">Posisi</label>
                    <p class="text-sm text-gray-900 dark:text-white">${data.position || '-'}</p>
                </div>
            </div>
            <div class="space-y-4">
                <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                    <label class="text-xs text-gray-500 dark:text-gray-400 uppercase">No HP</label>
                    <p class="text-sm text-gray-900 dark:text-white">${data.no_hp || '-'}</p>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                    <label class="text-xs text-gray-500 dark:text-gray-400 uppercase">Tgl Rekrut</label>
                    <p class="text-sm text-gray-900 dark:text-white">${data.tgl_rekrut || '-'}</p>
                </div>
                <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-lg">
                    <label class="text-xs text-gray-500 dark:text-gray-400 uppercase">Status</label>
                    <p class="text-sm">
                        <span class="px-3 py-1 rounded-full text-xs font-medium
                            ${data.status_karyawan === 'Tetap' ? 'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200' : ''}
                            ${data.status_karyawan === 'Kontrak' ? 'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200' : ''}
                            ${data.status_karyawan === 'OS' ? 'bg-purple-100 dark:bg-purple-900 text-purple-800 dark:text-purple-200' : ''}">
                            ${data.status_karyawan || '-'}
                        </span>
                    </p>
                </div>
            </div>
        </div>
    `,
    employment: (data) => `<p class="text-gray-900 dark:text-white">Data kepegawaian: ${data.employment_status || '-'}</p>`,
    bank: (data) => `<p class="text-gray-900 dark:text-white">Bank: ${data.nama_bank || '-'}</p>`
};

window.openModal = function(employeeId) {
    console.log('openModal:', employeeId);
    
    const modal = document.getElementById('employeeModal');
    const loading = document.getElementById('modalLoading');
    const content = document.getElementById('modalContent');
    
    if (!modal) return;
    
    modal.classList.remove('hidden');
    modal.style.display = 'flex';
    loading.style.display = 'flex';
    content.style.display = 'none';
    
    fetch('/hr/employees/' + employeeId + '/detail/')
        .then(r => r.json())
        .then(result => {
            loading.style.display = 'none';
            content.style.display = 'block';
            
            if (result.success) {
                window.currentEmployeeData = result.data;
                content.innerHTML = tabTemplates.personal(result.data);
            } else {
                content.innerHTML = '<p class="text-red-500">Gagal memuat data</p>';
            }
        })
        .catch(err => {
            loading.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = '<p class="text-red-500">Error: ' + err.message + '</p>';
        });
};

window.closeModal = function() {
    document.getElementById('employeeModal').classList.add('hidden');
};

window.switchTab = function(tabName) {
    if (window.currentEmployeeData && tabTemplates[tabName]) {
        document.getElementById('modalContent').innerHTML = tabTemplates[tabName](window.currentEmployeeData);
    }
};

window.editEmployee = function() {
    alert('Fitur edit dummy');
};

// Event listener
document.addEventListener('DOMContentLoaded', function() {
    console.log('Modal siap');
    
    // Pasang listener ke semua elemen dengan data-nik
    document.querySelectorAll('[data-nik]').forEach(el => {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            window.openModal(this.dataset.nik);
        });
    });
});
</script>
