<!-- Modal Detail Karyawan -->
<div id="employeeModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 999999;">
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px;">
        <div style="background: white; border-radius: 12px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);">
            
            <!-- Header -->
            <div style="background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.25rem; font-weight: 600;">Detail Karyawan</h3>
                <button onclick="closeModal()" style="background: none; border: none; color: white; font-size: 1.8rem; line-height: 1; cursor: pointer; opacity: 0.8;">&times;</button>
            </div>
            
            <!-- Body -->
            <div style="padding: 20px;">
                <!-- Loading -->
                <div id="modalLoading" style="text-align: center; padding: 40px;">
                    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                    <p style="color: #6b7280; margin: 0;">Memuat data karyawan...</p>
                </div>
                
                <!-- Content -->
                <div id="modalContent" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
console.log('Modal siap');

function openModal(employeeId) {
    const modal = document.getElementById('employeeModal');
    const loading = document.getElementById('modalLoading');
    const content = document.getElementById('modalContent');
    
    modal.style.display = 'block';
    loading.style.display = 'block';
    content.style.display = 'none';
    
    fetch('/hr/employees/' + employeeId + '/detail/')
        .then(r => r.json())
        .then(result => {
            loading.style.display = 'none';
            content.style.display = 'block';
            
            if (result.success) {
                const d = result.data;
                content.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div style="background: #f9fafb; padding: 12px; border-radius: 8px;">
                            <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase;">NIK</div>
                            <div style="font-weight: 600;">${d.employee_id || '-'}</div>
                        </div>
                        <div style="background: #f9fafb; padding: 12px; border-radius: 8px;">
                            <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase;">Nama</div>
                            <div style="font-weight: 600;">${d.nama || '-'}</div>
                        </div>
                        <div style="background: #f9fafb; padding: 12px; border-radius: 8px;">
                            <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase;">Department</div>
                            <div>${d.department || '-'}</div>
                        </div>
                        <div style="background: #f9fafb; padding: 12px; border-radius: 8px;">
                            <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase;">Posisi</div>
                            <div>${d.position || '-'}</div>
                        </div>
                        <div style="background: #f9fafb; padding: 12px; border-radius: 8px;">
                            <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase;">Status</div>
                            <div><span style="background: ${d.status_karyawan == 'Tetap' ? '#10b981' : d.status_karyawan == 'Kontrak' ? '#f59e0b' : '#8b5cf6'}; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.875rem;">${d.status_karyawan || '-'}</span></div>
                        </div>
                        <div style="background: #f9fafb; padding: 12px; border-radius: 8px;">
                            <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase;">No HP</div>
                            <div>${d.no_hp || '-'}</div>
                        </div>
                        <div style="background: #f9fafb; padding: 12px; border-radius: 8px; grid-column: span 2;">
                            <div style="font-size: 0.75rem; color: #6b7280; text-transform: uppercase;">Tanggal Rekrut</div>
                            <div>${d.tgl_rekrut || '-'}</div>
                        </div>
                    </div>
                `;
            } else {
                content.innerHTML = '<p style="color: #ef4444; text-align: center;">Gagal memuat data</p>';
            }
        })
        .catch(() => {
            loading.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = '<p style="color: #ef4444; text-align: center;">Terjadi kesalahan</p>';
        });
}

function closeModal() {
    document.getElementById('employeeModal').style.display = 'none';
}

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('[data-nik]').forEach(el => {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            openModal(this.dataset.nik);
        });
    });
});
</script>
