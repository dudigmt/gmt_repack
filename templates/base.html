<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GMT Repack{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">GMT Repack</h1>
            <div class="flex space-x-4 mt-2 md:mt-0">
                <a href="{% url 'home' %}" class="hover:bg-blue-700 px-3 py-2 rounded">Home</a>
                <a href="{% url 'hr:dashboard' %}" class="hover:bg-blue-700 px-3 py-2 rounded">HR</a>
                <a href="{% url 'production:dashboard' %}" class="hover:bg-blue-700 px-3 py-2 rounded">Production</a>
                <a href="{% url 'warehouse:dashboard' %}" class="hover:bg-blue-700 px-3 py-2 rounded">Warehouse</a>
                <a href="{% url 'admin:index' %}" class="hover:bg-blue-700 px-3 py-2 rounded">Admin</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
