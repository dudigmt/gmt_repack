{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    <li>
        <a href="#" class="button" style="background: #2196F3; color: white; padding: 8px 15px; border-radius: 4px;" onclick="showCreateUserModal()">
            Create User (Simple)
        </a>
    </li>
    {{ block.super }}
{% endblock %}

{% block content %}
    {{ block.super }}
    
    <!-- Modal Create User -->
    <div id="createUserModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        <div style="background-color: white; margin: 5% auto; padding: 20px; width: 450px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 style="margin-top: 0;">Buat User Baru (Password Sederhana)</h2>
            <form method="post" action="{% url 'create-user' %}">
                {% csrf_token %}
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 3px;">Username *</label>
                    <input type="text" name="username" required style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 3px;">Password *</label>
                    <input type="password" name="password" required style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 3px;">First Name</label>
                    <input type="text" name="first_name" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 3px;">Last Name</label>
                    <input type="text" name="last_name" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 3px;">Email</label>
                    <input type="email" name="email" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="display: block; margin-bottom: 3px;">Employee ID (NIK)</label>
                    <input type="text" name="employee_id" placeholder="Opsional" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>
                        <input type="checkbox" name="is_superuser"> Superuser
                    </label>
                </div>
                <div style="text-align: right;">
                    <button type="button" onclick="hideCreateUserModal()" style="padding: 8px 15px; margin-right: 5px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Batal</button>
                    <button type="submit" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Buat User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showCreateUserModal() {
            document.getElementById('createUserModal').style.display = 'block';
        }
        
        function hideCreateUserModal() {
            document.getElementById('createUserModal').style.display = 'none';
        }
        
        window.onclick = function(event) {
            var modal = document.getElementById('createUserModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
{% endblock %}
