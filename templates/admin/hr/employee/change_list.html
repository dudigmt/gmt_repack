{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    <li>
        <a href="#" class="button" style="background: #4CAF50; color: white; padding: 8px 15px; border-radius: 4px;" onclick="showImportModal()">
            Import Excel
        </a>
    </li>
    {{ block.super }}
{% endblock %}

{% block content %}
    {{ block.super }}
    
    <!-- Modal Import -->
    <div id="importModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
        <div style="background-color: white; margin: 10% auto; padding: 20px; width: 400px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 style="margin-top: 0;">Import Data Karyawan</h2>
            <form method="post" enctype="multipart/form-data" action="/admin/hr/employee/import-excel/">
                {% csrf_token %}
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Pilih file Excel:</label>
                    <input type="file" name="file" accept=".xlsx" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="text-align: right;">
                    <button type="button" onclick="hideImportModal()" style="padding: 8px 15px; margin-right: 5px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Batal</button>
                    <button type="submit" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Import</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function showImportModal() {
            document.getElementById('importModal').style.display = 'block';
        }
        
        function hideImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }
        
        // Tutup modal jika klik di luar
        window.onclick = function(event) {
            var modal = document.getElementById('importModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        function showImportModal() {
            document.getElementById('importModal').style.display = 'block';
        }
        
        function hideImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }
        
        function showCreateUserModal() {
            document.getElementById('createUserModal').style.display = 'block';
        }
        
        function hideCreateUserModal() {
            document.getElementById('createUserModal').style.display = 'none';
        }
        
        // Tutup modal jika klik di luar
        window.onclick = function(event) {
            var importModal = document.getElementById('importModal');
            var userModal = document.getElementById('createUserModal');
            if (event.target == importModal) {
                importModal.style.display = 'none';
            }
            if (event.target == userModal) {
                userModal.style.display = 'none';
            }
        }
    </script>
{% endblock %}
