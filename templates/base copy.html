<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GMT Repack{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 font-sans antialiased">
    {% block header %}
    <header class="bg-white shadow-sm h-16 flex items-center px-4 md:px-6 lg:px-8 sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">GMT Repack</h1>
        <div class="ml-auto flex items-center space-x-4">
            <!-- User Profile -->
            <div class="relative" id="user-profile">
                <button class="flex items-center space-x-2 p-1 rounded-lg hover:bg-gray-100 transition-colors duration-200" id="userMenuButton">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold text-sm">
                        {% if user.is_authenticated %}
                            {{ user.first_name|first|default:user.username|first|upper }}
                        {% else %}
                            G
                        {% endif %}
                    </div>
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <!-- Dropdown -->
                <div class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-gray-200 py-1 z-50" id="userDropdown">
                    {% if user.is_authenticated %}
                        <div class="px-4 py-2 border-b border-gray-100">
                            <p class="text-sm font-medium text-gray-900">{{ user.get_full_name|default:user.username }}</p>
                            <p class="text-xs text-gray-500 truncate">{{ user.email|default:"No email" }}</p>
                        </div>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                        <div class="border-t border-gray-100 my-1"></div>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Logout</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="block px-4 py-2 text-sm text-blue-600 hover:bg-blue-50">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </header>
    {% endblock %}

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <script>
        // User dropdown toggle
        const userMenuButton = document.getElementById('userMenuButton');
        const userDropdown = document.getElementById('userDropdown');

        if (userMenuButton && userDropdown) {
            userMenuButton.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!userMenuButton.contains(e.target) && !userDropdown.contains(e.target)) {
                    userDropdown.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
